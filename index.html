<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00612b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boemi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kedai Kopi Boemi - TataKas</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style id="pgstyle"></style>
</head>
<body>

<!-- memuat -->
<div id="boot" class="boot" aria-label="Memuat"><div class="spin"></div></div>

<!-- layar masuk (kode akses) -->
<div id="auth" class="auth" hidden></div>

<!-- aplikasi -->
<div id="shell" class="shell" hidden>
  <aside id="side" class="side" aria-label="Menu samping"></aside>
  <div class="stage"><main id="view"></main></div>
  <nav id="dock" class="dock" aria-label="Navigasi utama"></nav>
</div>

<div id="sheets" class="sheets"></div>
<div id="toast" class="toasts" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip"></div>

<noscript><p style="padding:24px;color:#fff;font-family:sans-serif">Aplikasi ini membutuhkan JavaScript.</p></noscript>

<script src="config.js"></script>
